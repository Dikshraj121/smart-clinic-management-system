<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="sidebar">
    <h2><i class="fas fa-clinic-medical" style="margin-right: 0.5rem;"></i>Clinic</h2>
    <a href="patients.html"><i class="fas fa-users" style="margin-right: 0.5rem;"></i>Patients</a>
    <a href="appointments.html"><i class="fas fa-calendar-alt" style="margin-right: 0.5rem;"></i>Appointments</a>
    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt" style="margin-right: 0.5rem;"></i>Logout</a>
</div>

<div class="main">
    <div class="container">
        <h1>Dashboard</h1>

        <div class="cards">
            <div class="card">
                <i class="fas fa-users fa-2x" style="color: #43a047; margin-bottom: 1rem;"></i>
                <h3>Total Patients</h3>
                <p id="totalPatients">0</p>
            </div>

            <div class="card">
                <i class="fas fa-calendar-alt fa-2x" style="color: #43a047; margin-bottom: 1rem;"></i>
                <h3>Total Appointments</h3>
                <p id="totalAppointments">0</p>
            </div>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
<script>
    // Load dashboard data when page loads
    window.addEventListener('load', function() {
        loadPatients();
        loadAppointments();
    });
</script>
</body>
</html>
